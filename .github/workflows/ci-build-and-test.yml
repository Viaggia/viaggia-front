name: Viaggia Frontend CI - Build and Test

on:
    push:
        branches:
            - main
            - main-dev
            - test
            - main-Victor
            - test-Victor
    pull_request:
        branches:
            - main
            - main-dev
            - test
            - test-Victor
            - main-Victor

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint
              continue-on-error: true

            - name: Run type checking
              run: npx tsc --noEmit
              continue-on-error: true

            - name: Build the project
              run: npm run build

            - name: Run tests (if available)
              run: npm test --if-present
              continue-on-error: true

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-build
                  path: dist/
                  retention-days: 7

    docker-build:
        runs-on: ubuntu-latest
        needs: build-and-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image (dev)
              run: |
                  cd docker
                  docker build -f Dockerfile.dev -t viaggia-frontend:dev ..

            - name: Test Docker container
              run: |
                  docker run --rm -d --name test-frontend -p 3000:3000 viaggia-frontend:dev
                  sleep 10
                  curl -f http://localhost:3000 || exit 1
                  docker stop test-frontend
